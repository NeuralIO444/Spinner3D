[workspace]
members = ["spinner-hello", "spinner-stroke", "spinner-stroke-core", "spinner-gesture", "spinner-gesture-core", "spinner-assets", "spinner-pressure", "spinner-pressure-core", "spinner-meshcore"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Pedantic is noisy for FFI crates; keep useful subset.
doc_markdown = "allow"
missing_safety_doc = "allow"
manual_unwrap_or = "allow"
